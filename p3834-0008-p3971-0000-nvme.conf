# p3834-0008-p3971-0000-nvme.conf: configuration for "P3834 + P3971 (NVME)"
# (T264 P3970).

# Sourced by bash script.
# Disable unused variable check. Most of these variables are used in an outer
# script that sources this file.

source "${LDK_DIR}/p3834-0008-p3971-0000.conf";

DTB_FILE="tegra264-p3971-0080+p3834-0008-qspi-nvme.dtb";
TBCDTB_FILE="${DTB_FILE}";

ODMDATA="uphy0-config-6,pcie@3_status=okay";
# Do not set uphy-lanes for nvme
UPHY_CONFIG=""
EXTERNAL_PT_LAYOUT="tools/kernel_flash/flash_l4t_t264_nvme.xml";
EXTERNAL_DEVICE="nvme0n1p1";

# Uncomment below line to enable C4 RP controller in SRIS mode
#ODMDATA+=",pcie@4_clk-scheme=1"
# Uncomment below line to enable C4 controller in Endpoint SRIS mode.
#ODMDATA+=",pcie-c4-endpoint-enable,pcie-c4-endpoint-use-int-refclk,pcie@4_clk-scheme=1_pcie-mode=2"
# Uncomment below line to enable C4 controller in Endpoint common clock mode.
#ODMDATA+=",pcie-c4-endpoint-enable,pcie@4_pcie-mode=2"

# Rootfs A/B:
if [[ "${ROOTFS_AB}" == 1 && "${ROOTFS_ENC}" == "" ]]; then
	EXTERNAL_PT_LAYOUT="tools/kernel_flash/flash_l4t_t264_nvme_rootfs_ab.xml";
# Disk Encryption
elif [[  "${ROOTFS_AB}" == "" && "${ROOTFS_ENC}" == 1 ]]; then
	disk_enc_enable=1;
	EXTERNAL_PT_LAYOUT="tools/kernel_flash/flash_l4t_t264_nvme_rootfs_enc.xml";
# Rootfs A/B + Disk encryption support:
elif [[ "${ROOTFS_AB}" == 1 && "${ROOTFS_ENC}" == 1 ]]; then
	disk_enc_enable=1;
	EXTERNAL_PT_LAYOUT="tools/kernel_flash/flash_l4t_t264_nvme_rootfs_ab_enc.xml";
fi
