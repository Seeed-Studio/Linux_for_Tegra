# Sourced by bash script.
# Disable unused variable check. Most of these variables are used in an outer
# script that sources this file.

source "${LDK_DIR}/p3737-0000-p3701-0000.conf";

platform_emulation_overlay()
{
	OVERLAY_DTB_FILE+=",tegra234-p3737-0000+p3701-0000-as-p3767-0000.dtbo";
	# Select the Base DTB based on SKU
	if [ "${board_sku}" = "0000" ]; then
		BPFDTB_FILE="tegra234-bpmp-3701-0000-as-3767-0000-3737-0000.dtb";
		EMC_BCT="tegra234-p3701-0000-as-p3767-0000-sdram-l4t.dts";
		WB0SDRAM_BCT="tegra234-p3701-0000-as-p3767-0000-wb0sdram-l4t.dts";
		CMDLINE_ADD+=" nr_cpus=8";
	elif [ "${board_sku}" = "0005" ]; then
		BPFDTB_FILE="tegra234-bpmp-3701-0005-as-3767-0000-3737-0000.dtb";
		EMC_BCT="tegra234-p3701-0005-as-p3767-0000-sdram-l4t.dts";
		WB0SDRAM_BCT="tegra234-p3701-0005-as-p3767-0000-wb0sdram-l4t.dts";
		CMDLINE_ADD+=" nr_cpus=8 mem=16G";
	else
		echo "Error: Unrecognized module SKU ${board_sku} for emulation";
		exit 1;
	fi
}

update_flash_args()
{
	update_flash_args_common
	platform_emulation_overlay
}
