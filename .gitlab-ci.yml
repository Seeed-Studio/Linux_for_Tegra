variables:
        START_TASK: ""

stages:
    - xavier-nx-industrial-16g
    - xavier-nx-industrial-8g
    - xavier-nx-devkit-16g
    - xavier-nx-devkit-8g
    - orin-nx-industrial-8g
    - orin-nx-reserver-8g
    - orin-nx-devkit-8g
    - orin-nx-industrial-16g
    - orin-nx-reserver-16g
    - orin-nx-devkit-16g
    - orin-nano-industrial-8g
    - orin-nano-reserver-8g
    - orin-nano-devkit-8g
    - orin-nano-industrial-4g
    - orin-nano-reserver-4g
    - orin-nano-devkit-4g
    - orin-nx-j40mini-8g
    - orin-nx-j40mini-16g
    - orin-nano-j40mini-4g
    - orin-nano-j40mini-8g
    - reserver-agx-orin-32g-j501
    - reserver-agx-orin-32g-j501-gmsl
    - reserver-agx-orin-64g-j501
    - reserver-agx-orin-64g-j501-gmsl


job-xavier-nx-industrial-16g:
    stage: xavier-nx-industrial-16g
    rules:
      - if: '$CI_COMMIT_TAG' 
        when: on_success
      - if: '$START_TASK == "xavier-nx"'
        when: on_success
      - if: '$START_TASK == "xavier-nx-industrial"'
        when: on_success
      - if: '$START_TASK == $CI_JOB_STAGE'
        when: on_success
    # image: ubuntu:22.04
    # services:
    #   - docker:dind
    tags:
      - x86-shell


    script:
         - id
         - export DATE_STR=$(TZ='Asia/Hong_Kong' date +%Y-%m-%d)
        #  - echo "alias sudo='sudo -h 127.0.0.1'" >> ~/.bash_aliases
        #  - source ~/.bashrc
        #  - hostname localhost
        #  - mkdir -p /etc/udev/rules.d/
        #  - sudo apt update && apt install -y wget bzip2 qemu-user-static sudo sshpass abootimg nfs-kernel-server libxml2-utils uuid-runtime cpio binutils 
         - wget  http://192.168.1.77/jetson/tegra_linux_sample-root-filesystem_r35.5.0_aarch64.tbz2 -q
         - tar xpf tegra_linux_sample-root-filesystem_r35.5.0_aarch64.tbz2 -C rootfs
         - ./apply_binaries.sh
         - echo "# Seeed Image Name mfi_recomputer-xavier-nx-16g-industrial-5.1-35.5.0-$DATE_STR.tar.gz" >> ./rootfs/etc/nv_tegra_release
         - wget http://192.168.1.77/jetson/bootlin-toolchain-gcc-93
         - mkdir -p l4t-gcc
         - tar xf bootlin-toolchain-gcc-93 -C ./l4t-gcc
         - export ARCH=arm64
         - export CROSS_COMPILE_AARCH64_PATH=`realpath .`/l4t-gcc
         - cd source/
         - export INSTALL_MOD_PATH=`realpath ../rootfs/`
         - ./nvbuild.sh -i -r ${INSTALL_MOD_PATH}
         - ./do_copy.sh
         - cd ..
         #  - ./tools/l4t_flash_prerequisites.sh
         - cp extra_scripts/recomputer_industrial/xavier-nx-seeed-industry.dtbo  kernel/dtb/
         - sudo ADDITIONAL_DTB_OVERLAY_OPT="BootOrderNvme.dtbo"  BOARDID=3668 BOARDSKU=0001 FAB=301  BOARDREV=B.0 ./tools/kernel_flash/l4t_initrd_flash.sh  -p "-c bootloader/t186ref/cfg/flash_l4t_t194_qspi_p3668.xml --no-systemimg"   --no-flash  --massflash 5 --network usb0 recomputer-xavier-nx-industrial  external
         - mkdir -p deploy
         - mount -t cifs -o username=$SMB_USER,password=$SMB_PWD,vers=3.0,uid=1000,gid=1000,rw,file_mode=0664 //192.168.1.77/red_2t/jetson deploy
         - cp  mfi_recomputer-xavier-nx-industrial.tar.gz  deploy/mfi_recomputer-xavier-nx-16g-industrial-qspiflash-5.1-35.5.0-$DATE_STR.tar.gz || true 
         - umount deploy
         - sed -i "s/<SOC>/t194/g" rootfs/etc/apt/sources.list.d/nvidia-l4t-apt-source.list
         - mount --bind /sys ./rootfs/sys
         - mount --bind /dev ./rootfs/dev
         - mount --bind /dev/pts ./rootfs/dev/pts
         - mount --bind /proc ./rootfs/proc
         - cp /usr/bin/qemu-aarch64-static rootfs/usr/bin/
         - cp extra_scripts/rootfs_magic.sh rootfs
        #  - cp extra_scripts/Image kernel/
         - KER_NUM=`basename $(find ./rootfs/lib/modules -mindepth 1 -maxdepth 1 -type d)`
        #  - cp extra_kernel_modules/lan743x.ko rootfs/lib/modules/5.10.104-tegra/kernel/drivers/net/ethernet/microchip/lan743x.ko
        #  - cp extra_kernel_modules/spi-tegra114.ko rootfs/lib/modules/5.10.104-tegra/kernel/drivers/spi/spi-tegra114.ko
        #  - cp extra_kernel_modules/8723du.ko rootfs/lib/modules/5.10.104-tegra/kernel/drivers/net/wireless/realtek/rtl8xxxu/8723du.ko
        #  - cp extra_kernel_modules/tpm/ rootfs/lib/modules/5.10.104-tegra/kernel/drivers/char/ -rf
         - mkdir -p rootfs/lib/modules/$KER_NUM/kernel/drivers/net/wireless/realtek/rtw88
         - cp extra_kernel_modules/rtl8723du/*.ko rootfs/lib/modules/$KER_NUM/kernel/drivers/net/wireless/realtek/rtw88/
         - chroot rootfs /rootfs_magic.sh
         # update kernel module dependencies
         - echo "current kernel number $KER_NUM"
         - sudo chroot rootfs depmod -a  $KER_NUM
         - umount ./rootfs/sys
         - umount ./rootfs/dev/pts
         - umount ./rootfs/dev
         - umount ./rootfs/proc
         - rm rootfs/rootfs_magic.sh
         - rm rootfs/usr/bin/qemu-aarch64-static
         - sudo ADDITIONAL_DTB_OVERLAY_OPT="BootOrderNvme.dtbo"  BOARDID=3668 BOARDSKU=0001 FAB=301  BOARDREV=F.0 ./tools/kernel_flash/l4t_initrd_flash.sh --external-device nvme0n1p1 -c tools/kernel_flash/flash_l4t_nvme.xml -S 80GiB  -p "-c bootloader/t186ref/cfg/flash_l4t_t194_qspi_p3668.xml --no-systemimg"   --no-flash  --massflash 5 --network usb0 --erase-all  recomputer-xavier-nx-industrial external
         - mkdir -p deploy
         - mount -t cifs -o username=$SMB_USER,password=$SMB_PWD,vers=3.0,uid=1000,gid=1000,rw,file_mode=0664 //192.168.1.77/red_2t/jetson deploy
         - cp  mfi_recomputer-xavier-nx-industrial.tar.gz  deploy/mfi_recomputer-xavier-nx-16g-industrial-5.1-35.5.0-$DATE_STR.tar.gz || true 
         - umount deploy


