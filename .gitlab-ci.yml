  - recomputer-super-orin-nano-8g-j401
  - recomputer-rugged-orin-nx-8g-j401
  - recomputer-rugged-orin-nx-16g-j401
  - recomputer-rugged-orin-nano-4g-j401
  - recomputer-rugged-orin-nano-8g-j401

