variables:
  CONFIG: ""
  BOARDID: ""
  BOARDSKU: ""
  FAB: ""
  BOARDREV: ""
  CHIP_SKU: ""
  IS_CUSTOM: "0" #disable custom image build by default
  START_TASK: ""
  INSTALL_NV_JP: "1" #enable install nvidia-jetpack by default
  BUILD_QSPI_IMG: "1" #enable image build for qspi flash by default
  JETPACKVER: "7.2.0" # TODO: confirm exact JetPack version for L4T r39.2.0
  JETSONVER: "39.2.0"
  ROOTFS_NAME: "Tegra_Linux_Sample-Root-Filesystem_r39.2.0_aarch64.tbz2"
  UPDATE_DRV_DEPEND: "1"
  KCFLAGS: ""

default:
  timeout: 3h

stages:
  - jetson-agx-thor-devkit
  - recomputer-thor-carrier-j6015
  - recomputer-thor-carrier-j6014
