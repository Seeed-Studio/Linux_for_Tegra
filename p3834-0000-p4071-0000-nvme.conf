EMC_BCT="tegra264-p3834-0000-sdram-bct-l4t.dts";
WB0SDRAM_BCT="tegra264-p3834-0000-sdram-bct-warmboot-l4t.dts";
BPMP_MEM_CONFIG="tegra264-p3834-0000-sdram-dfs.dts";
PMIC_CONFIG="tegra264-mb1-bct-pmic-p3834-0000-p4071-0000.dts";
MISC_CONFIG="tegra264-mb1-bct-misc-p3834-0000-p4071-0000.dts";
