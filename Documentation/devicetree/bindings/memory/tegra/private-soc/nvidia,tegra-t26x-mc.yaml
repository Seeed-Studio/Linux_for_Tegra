%YAML 1.2
---
$id: http://devicetree.org/schemas/mc_carveout@8108020000/nvidia,tegra-t26x-mc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: FIXME -- add title

maintainers:
  - FIXME -- add maintainers

description: |
     the compatability = nvidia,tegra-t26x-mc is mentioned in the following drivers
        - <TOP>/kernel/nvidia-oot/drivers/memory/tegra/private-soc/mc-t26x.c

     The following nodes use this compatibility
        - /bus@0/mc_carveout@8108020000

select:
  properties:
    compatible:
        minItems: 1
        maxItems: 1
        items:
            enum:
                - nvidia,tegra-t26x-mc

  required:
    - compatible

properties:

    reg:
        $ref: "/schemas/types.yaml#/definitions/uint32-matrix"
        description: |
            Registers are given by a tuple of two values:
                - register address:
                - register block size.
        items:
            minItems: 4
            maxItems: 4
            items:
                - $ref: "/schemas/types.yaml#/definitions/uint32"
                  minimum: 0x81
                  maximum: 0x81
                - $ref: "/schemas/types.yaml#/definitions/uint32"
                  minimum: 0x8020000
                  maximum: 0x8020000
                - $ref: "/schemas/types.yaml#/definitions/uint32"
                  minimum: 0x0
                  maximum: 0x0
                - $ref: "/schemas/types.yaml#/definitions/uint32"
                  minimum: 0x20000
                  maximum: 0x20000

required:
    - compatible
    - reg

examples:
    - |
        mc_carveout@8108020000 {
            compatible = "nvidia,tegra-t26x-mc";
            reg = <0x81 0x08020000 0x0 0x20000>;
            status = "disabled";
        };
