%YAML 1.2
---
$id: http://devicetree.org/schemas/memqual@f020000/nvidia,tegra-t264-mem-qual.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: FIXME -- add title

maintainers:
  - FIXME -- add maintainers

description: |
     the compatability = nvidia,tegra-t264-mem-qual is mentioned in the following drivers
        - <TOP>/kernel/nvidia-oot/drivers/memory/tegra/private-soc/mem-qual.c

     The following nodes use this compatibility
        - /bus@0/memqual@f020000
        - /bus@0/memqual@a808730000
        - /bus@0/memqual@818d020000
        - /bus@0/memqual@a808750000
        - /bus@0/memqual@818d030000

select:
  properties:
    compatible:
        minItems: 1
        maxItems: 1
        items:
            enum:
                - nvidia,tegra-t264-mem-qual

  required:
    - compatible

properties:

    reg:
        $ref: "/schemas/types.yaml#/definitions/uint32-matrix"
        description: |
            Registers are given by a tuple of two values:
                - register address:
                - register block size.
        items:
            minItems: 4
            maxItems: 4
            items:
                - $ref: "/schemas/types.yaml#/definitions/uint32"
                  minimum: 0x0
                  maximum: 0xa8
                - $ref: "/schemas/types.yaml#/definitions/uint32"
                  minimum: 0x8730000
                  maximum: 0x8d030000
                - $ref: "/schemas/types.yaml#/definitions/uint32"
                  minimum: 0x0
                  maximum: 0x0
                - $ref: "/schemas/types.yaml#/definitions/uint32"
                  minimum: 0x10000
                  maximum: 0x10000

    iommus:
        $ref: "/schemas/types.yaml#/definitions/uint32-matrix"
        description: |
            iommus are given by a tuple of 2 values:
                - Phandle to the device
                - Device ID
        items:
            minItems: 2
            maxItems: 2
            items:
                - $ref: "/schemas/types.yaml#/definitions/uint32"
                - $ref: "/schemas/types.yaml#/definitions/uint32"
                  minimum: 0x0
                  maximum: 0x3f00

    dma-coherent:
        $ref: "/schemas/types.yaml#/definitions/flag"

required:
    - compatible
    - reg
    - iommus

examples:
    - |
        memqual@f020000 {
            compatible = "nvidia,tegra-t264-mem-qual";
            status = "disabled";
            reg = <0x0 0x0f020000 0x0 0x10000>;
            iommus = <&smmu1_mmu TEGRA_SID_MIU0>,
                     <&smmu1_mmu TEGRA_SID_MIU1>;
            dma-coherent;
        };
