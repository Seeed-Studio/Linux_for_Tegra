%YAML 1.2
---
$id: http://devicetree.org/schemas/ete_cpu_0/arm,embedded-trace-extension.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Arm CoreSight Program Flow Trace v4.x driver

maintainers:
  - Eric Funsten

description: |
     the compatability = arm,embedded-trace-extension is mentioned in the following drivers
        - <TOP>/kernel/kernel-oot/drivers/hwtracing/coresight/coresight-etm4x-core.c

     The following nodes use this compatibility
        - /ete_cpu_0
        - /ete_cpu_1
        - /ete_cpu_2
        - /ete_cpu_3
        - /ete_cpu_4
        - /ete_cpu_5
        - /ete_cpu_6
        - /ete_cpu_7
        - /ete_cpu_8
        - /ete_cpu_9
        - /ete_cpu_10
        - /ete_cpu_11
        - /ete_cpu_12
        - /ete_cpu_13

select:
  properties:
    compatible:
        minItems: 1
        maxItems: 1
        items:
            enum:
                - arm,embedded-trace-extension

  required:
    - compatible

properties:

    cpu:
        $ref: "/schemas/types.yaml#/definitions/uint32"

required:
    - compatible

examples:
    - |
        ete_cpu_0 {
            compatible = "arm,embedded-trace-extension";
            status = "disabled";
            cpu = <&cpu_0>;
        };
