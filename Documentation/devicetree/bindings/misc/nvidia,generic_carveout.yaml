%YAML 1.2
---
$id: http://devicetree.org/schemas/generic_carveout/nvidia,generic_carveout.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nvidia Generic Carveout

maintainers:
  - Sachin Nikam

description: |
     The following nodes use this compatibility
        - /reserved-memory/generic_carveout

select:
  properties:
    compatible:
        minItems: 1
        maxItems: 1
        items:
            enum:
                - nvidia,generic_carveout

  required:
    - compatible

properties:

    size:
        $ref: "/schemas/types.yaml#/definitions/uint32-matrix"
        items:
            minItems: 2
            maxItems: 2
            items:
                - $ref: "/schemas/types.yaml#/definitions/uint32"
                  minimum: 0x0
                  maximum: 0x0
                - $ref: "/schemas/types.yaml#/definitions/uint32"
                  minimum: 0x40000000
                  maximum: 0x40000000

    alignment:
        $ref: "/schemas/types.yaml#/definitions/uint32-matrix"
        items:
            minItems: 2
            maxItems: 2
            items:
                - $ref: "/schemas/types.yaml#/definitions/uint32"
                  minimum: 0x0
                  maximum: 0x0
                - $ref: "/schemas/types.yaml#/definitions/uint32"
                  minimum: 0x200000
                  maximum: 0x200000

    no-map:
        $ref: "/schemas/types.yaml#/definitions/flag"

required:
    - compatible

examples:
    - |
        generic_carveout {
            compatible = "nvidia,generic_carveout";
            status = "disabled";
            size = <0 0x40000000>;
            alignment = <0 0x200000>;
            no-map;
        };
