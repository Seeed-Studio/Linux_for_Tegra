%YAML 1.2
---
$id: http://devicetree.org/schemas/fsi-carveout/nvidia,fsi-carveout.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nvidia FSI Carveout

maintainers:
  - Sachin Nikam

description: |
     The following nodes use this compatibility
        - /reserved-memory/fsi-carveout

select:
  properties:
    compatible:
        minItems: 1
        maxItems: 1
        items:
            enum:
                - nvidia,fsi-carveout

  required:
    - compatible

properties:

    size:
        $ref: "/schemas/types.yaml#/definitions/uint32-matrix"
        items:
            minItems: 2
            maxItems: 2
            items:
                - $ref: "/schemas/types.yaml#/definitions/uint32"
                  minimum: 0x0
                  maximum: 0x0
                - $ref: "/schemas/types.yaml#/definitions/uint32"
                  minimum: 0x2000000
                  maximum: 0x2000000

    alignment:
        $ref: "/schemas/types.yaml#/definitions/uint32-matrix"
        items:
            minItems: 2
            maxItems: 2
            items:
                - $ref: "/schemas/types.yaml#/definitions/uint32"
                  minimum: 0x0
                  maximum: 0x0
                - $ref: "/schemas/types.yaml#/definitions/uint32"
                  minimum: 0x1000
                  maximum: 0x1000

    no-map:
        $ref: "/schemas/types.yaml#/definitions/flag"

    alloc-ranges:
        $ref: "/schemas/types.yaml#/definitions/uint32-matrix"
        items:
            minItems: 4
            maxItems: 4
            items:
                - $ref: "/schemas/types.yaml#/definitions/uint32"
                  minimum: 0x0
                  maximum: 0x0
                - $ref: "/schemas/types.yaml#/definitions/uint32"
                  minimum: 0x0
                  maximum: 0x0
                - $ref: "/schemas/types.yaml#/definitions/uint32"
                  minimum: 0x1
                  maximum: 0x1
                - $ref: "/schemas/types.yaml#/definitions/uint32"
                  minimum: 0x0
                  maximum: 0x0

required:
    - compatible

examples:
    - |
        fsi-carveout {
            compatible = "nvidia,fsi-carveout";
            status = "disabled";
            size = <0 0x2000000>;
            alignment = <0 0x1000>;
            no-map;
            alloc-ranges = <0x0 0x0 0x1 0x0>;
        };
