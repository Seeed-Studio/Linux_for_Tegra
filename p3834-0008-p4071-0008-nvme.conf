# p3834-0008-p4071-0008-nvme.conf: configuration for "IGX500 thor without safety"

# Sourced by bash script.
# Disable unused variable check. Most of these variables are used in an outer
# script that sources this file.

source "${LDK_DIR}/p3834-0008-p4071-0008-ufs.conf";

EXTERNAL_DEVICE="nvme0n1p1";
EXTERNAL_PT_LAYOUT="tools/kernel_flash/flash_l4t_t264_nvme.xml";

# Disk Encryption
if [ "${ROOTFS_ENC}" == 1 ]; then
	disk_enc_enable=1;
	EXTERNAL_PT_LAYOUT="tools/kernel_flash/flash_l4t_t264_nvme_rootfs_enc.xml";
fi

# BCT preprocessor defines:
# 1) The preprocessor defines are used during the build of BCT sources files
#    and are semicolon-separated.
# 2) The defines in COMMON will apply to RCMBOOT, RCMFLASH, and COLDBOOT.
# 3) Setting COLDBOOT_BCT_DEFINES will apply to both chain_a and chain_b.
# 4) If the defines is empty, leave a semicolon
COMMON_BCT_DEFINES="CONFIG_ENABLE_SC7"
RCMBOOT_BCT_DEFINES=";"
RCMFLASH_BCT_DEFINES=";"
COLDBOOT_BCT_DEFINES="ENABLE_DRAM_ECC_PRL"
