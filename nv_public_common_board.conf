# This is common board config to be sourced in all board.conf files.

# Sourced by bash script.
# Disable unused variable check. Most of these variables are used in an outer
# script that sources this file.

process_fuse_level() {
	local fuselevel="${1}";


	# fuselevel:
	#	"fuselevel_unknown"
	#	"fuselevel_nofuse"
	#	"fuselevel_production"
	#
	case ${fuselevel} in
	fuselevel_production)
		return
		;;
	*)
		echo "Error: only fuselevel_production is supported. Current fuselevel is ${fuselevel}"
		exit 167
		;;
	esac
}

process_chip_sku_version() {
	echo ""
}

process_board_version() {
	echo ""
}

