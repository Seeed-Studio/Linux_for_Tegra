# p3971-0000-p3701-0008.conf: configuration for "P3701-0008(CVM) + P3971-0000-B00(CVB)"

# Sourced by bash script.
# Disable unused variable check. Most of these variables are used in an outer
# script that sources this file.

source "${LDK_DIR}/p3701.conf.common";

DTB_FILE=tegra234-p3971-0000+p3701-0008-nv.dtb;
TBCDTB_FILE="${DTB_FILE}";

BPFDTB_FILE="tegra234-bpmp-3701-0008-3971-0000.dtb";
PINMUX_CONFIG="tegra234-mb1-bct-pinmux-p3971-0000-b00-p3701-0008.dtsi";
PMC_CONFIG="tegra234-mb1-bct-padvoltage-p3971-0000-b00-p3701-0008.dtsi";

EMMC_CFG="flash_t234_qspi_sdmmc_safety.xml";
ROOTFSSIZE=52GiB;

BADPAGEFILE="bootloader/badpage.bin";
FSIFWFILE="bootloader/fsi-lk.bin";
PMIC_CONFIG="tegra234-mb1-bct-pmic-p3971-0000-p3701-0008.dts";
MISC_CONFIG="tegra234-mb1-bct-misc-p3701-0008-flash.dts";
MISC_COLD_BOOT_CONFIG="tegra234-mb1-bct-misc-p3701-0008.dts";
MB2_BCT="tegra234-mb2-bct-misc-p3701-0008.dts";

ODMDATA="gbe-uphy-config-0,hsstp-lane-map-3,hsio-uphy-config-0,nvhs-uphy-config-0";
OVERLAY_DTB_FILE="L4TConfiguration.dtbo,tegra234-carveouts.dtbo,tegra-optee.dtbo,T234SetFmpImageTypeGuid.dtbo";
CMDLINE_ADD+=" pci=pcie_bus_perf";
