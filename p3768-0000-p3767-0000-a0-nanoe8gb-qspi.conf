# Sourced by bash script.
# Disable unused variable check. Most of these variables are used in an outer
# script that sources this file.

source "${LDK_DIR}/p3768-0000-p3767-0000-a0-qspi.conf";

orin_nanoe8gb_overlay()
{

	if [ "${board_sku}" = "0001" ]; then
		BPFDTB_FILE="tegra234-bpmp-3767-0003-3509-a02.dtb";
		DTB_FILE="tegra234-p3768-0000+p3767-0003-nv.dtb";
		TBCDTB_FILE="${DTB_FILE}";
	else
		echo "Error: module SKU ${board_sku} detected";
		exit 1;
	fi

}

update_flash_args()
{
	update_flash_args_common
	orin_nanoe8gb_overlay
}
